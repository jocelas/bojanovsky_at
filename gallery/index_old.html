var i = 0;
var out = '';

var numcols = 4;	
var size = '25vw';

var descr = "This is a very long description of the image, please do not remove this and read this, this is very important"

function maketable(filename) {
	if (i==0){
		out += '<tr>';
	}
	out += '<td style = "width: '+size+'; height: '+size+'"><a href = "photos/'+filename+'"><img src = "photos/'+filename+'" class = "tn"></a><div class = "des">'+descr+'</div></td>';
	i++;
	if (i == numcols){
		out += '</tr>';
		i = 0;
	}
}

function writetable(table){
	document.getElementById('maintable').innerHTML = table;
}

function changecols() {

	if (window.innerWidth < window.innerHeight){
		numcols = 2;
	} else {
		numcols = 4;
	}
	
	//var td = document.querySelector('table#maintable tr td');
	
	if (numcols == 2){
		size = '50vw'
	} else {
		size = '25vw';
	}
	
	out = '';
	i = 0;
	ims.forEach(maketable);
	writetable(out);

}

window.onload = function(){
	ims.forEach(maketable);
	writetable(out);
	changecols();
}
</script>
